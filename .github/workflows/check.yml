name: Check Open Profound
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  browser-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test apps/browser-lab/*.test.mjs
